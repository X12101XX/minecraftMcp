plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	mavenCentral()
}

loom {
	mods {
		"minecraft-mcp" {
			sourceSet sourceSets.main
		}
	}
	runs {
		client {
			runDir (project.findProperty("mc_rundir") ?: "../integration/client")
			programArg "--username"
			programArg (project.findProperty("mc_username") ?: "DevBuilder")
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform("org.junit:junit-bom:5.14.1")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def modVersion = project.version
	inputs.property "version", modVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

test {
	useJUnitPlatform()
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def modName = project.name
	inputs.property "projectName", modName
	from("../LICENSE") {
		rename { "${it}_${modName}" }
	}
}
